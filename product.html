<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FOOT Product</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a href="index.html" class="brand">FOOT</a>
    <button id="cart-button">🛒 <span id="cart-count">0</span></button>
  </div>
</header>

<main class="section">
  <div class="container">
    <a href="index.html#shop">← Back</a>
    <div id="product-details"></div>

    <h2>Reviews</h2>
    <div id="product-review-list"></div>
  </div>
</main>

<div class="modal hidden" id="review-modal">
  <div class="modal-box">
    <button data-close-modal>Close</button>

    <form id="review-form">
      <select id="review-product"></select>
      <input id="review-name" required>
      <select id="review-rating">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
      </select>
      <input id="review-title" required>
      <textarea id="review-body"></textarea>
      <button type="submit">Post</button>
    </form>
  </div>
</div>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
