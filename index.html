<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOOT Fishing & Co.</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="shipping-bar">
🚚 Free shipping over $150
</div>

<header class="site-header">
<div class="container nav-wrap">

<div class="brand">FOOT™ Fishing & Co.</div>

<nav>
<a href="#shop">Shop</a>
<a href="#reviews">Reviews</a>
<a href="#contact">Order</a>
</nav>

<button id="cart-button">
🛒 <span id="cart-count">0</span>
</button>

</div>
</header>

<section class="hero">
<h1>Built by anglers. For anglers.</h1>
<p>Find the perfect rod — not just any rod.</p>
</section>

<section id="shop" class="container">

<h2>Shop</h2>

<div class="filter-row">
<button class="filter active" data-category="all">All</button>
<button class="filter" data-category="Beginner">Beginners</button>
<button class="filter" data-category="Teen">Teens</button>
</div>

<div id="product-grid" class="product-grid"></div>

</section>

<!-- ORDER FORM -->
<section id="contact" class="container">
<h2>Order / Enquiry</h2>

<form id="order-form">

<input type="text" id="cust-name" placeholder="Your name" required>
<input type="email" id="cust-email" placeholder="Your email" required>
<input type="text" id="location" placeholder="Where are you located?" required>

<select id="product-select"></select>

<textarea id="message" placeholder="Extra details"></textarea>

<button type="submit">Send Enquiry</button>

</form>
</section>

<!-- REVIEWS -->
<section id="reviews" class="container">
<h2>Reviews</h2>

<button id="open-review">Write Review</button>

<div id="review-list"></div>
</section>

<!-- CART -->
<div class="modal hidden" id="cart-modal">
<div class="modal-box">
<button id="close-cart">Close</button>

<h2>Your Cart</h2>

<div id="shipping-progress"></div>

<div id="cart-items"></div>
<h3 id="cart-total">Total: $0</h3>
</div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal hidden" id="product-modal">
<div class="modal-box">
<button id="close-product">Close</button>
<div id="product-content"></div>
</div>
</div>

<!-- REVIEW MODAL -->
<div class="modal hidden" id="review-modal">
<div class="modal-box">
<button id="close-review">Close</button>

<form id="review-form">
<input id="review-name" placeholder="Name (or Anonymous)">
<select id="review-product"></select>

<select id="review-rating">
<option value="5">5</option>
<option value="4">4</option>
<option value="3">3</option>
</select>

<input id="review-title" placeholder="Title" required>
<textarea id="review-body"></textarea>

<button type="submit">Post</button>
</form>
</div>
</div>

<footer>
© 2026 FOOT Fishing and Co.
</footer>

<script src="products.js"></script>
<script src="app.js"></script>

</body>
</html>
