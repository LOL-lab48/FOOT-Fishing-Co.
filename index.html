<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FOOT — By anglers. For anglers.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">FOOT</span>
      <span class="brand-copy"><strong>FOOT</strong><small>By anglers. For anglers.</small></span>
    </a>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="#shop">Shop</a>
      <a href="#reviews">Reviews</a>
      <a href="#about">About</a>
    </nav>

    <button class="cart-button" id="cart-button">🛒 <span id="cart-count">0</span></button>
  </div>
</header>

<main>

<section class="hero">
  <div class="container hero-grid">
    <div>
      <h1>Find the rod that fits your fishing.</h1>
      <p>FOOT helps anglers choose gear from trusted brands.</p>
      <a href="#shop" class="btn primary">Shop rods</a>
    </div>
  </div>
</section>

<section id="shop" class="section">
  <div class="container">
    <h2>Shop rods</h2>
    <div class="filter-row">
      <button class="filter" data-category="all">All</button>
      <button class="filter" data-category="Beginner">Beginners</button>
      <button class="filter" data-category="Teen">Teens</button>
    </div>

    <div id="product-grid" class="product-grid"></div>
  </div>
</section>

<section id="reviews" class="section">
  <div class="container">
    <h2>Reviews</h2>
    <button id="open-review" class="btn primary">Write review</button>
    <div id="review-list"></div>
  </div>
</section>

<section id="about" class="section">
  <div class="container">
    <h2>About FOOT</h2>
    <p>By anglers. For anglers.</p>
  </div>
</section>

</main>

<!-- REVIEW MODAL -->
<div class="modal hidden" id="review-modal">
  <div class="modal-box">
    <button data-close-modal>Close</button>

    <form id="review-form">
      <select id="review-product"></select>
      <input id="review-name" placeholder="Name" required>
      <select id="review-rating">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
      </select>
      <input id="review-title" placeholder="Title" required>
      <textarea id="review-body" placeholder="Review"></textarea>
      <button type="submit">Post</button>
    </form>
  </div>
</div>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
