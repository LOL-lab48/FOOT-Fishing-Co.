<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FOOT — Fishing Ocean Outdoor Tackle</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
  <div class="container nav-wrap">

    <a class="brand" href="index.html">
      <span class="brand-mark">FOOT</span>
      <span class="brand-copy">
        <strong>FOOT</strong>
        <small>Fishing Ocean Outdoor Tackle</small>
      </span>
    </a>

    <nav class="nav">
      <a href="#shop">Shop</a>
      <a href="#reviews">Reviews</a>
      <a href="#about">About</a>
    </nav>

    <button class="cart-button" id="cart-button">
      🛒 <span id="cart-count">0</span>
    </button>

  </div>
</header>

<main>

<!-- HERO -->
<section class="hero">
  <div class="container hero-grid">
    <div>
      <h1>Find the rod that fits your fishing.</h1>
      <p>FOOT helps anglers choose gear from trusted brands.</p>
      <a href="#shop" class="btn primary">Shop rods</a>
    </div>
  </div>
</section>

<!-- SHOP -->
<section id="shop" class="section">
  <div class="container">

    <h2>Shop rods</h2>

    <div class="filter-row">
      <button class="filter" data-category="all">All</button>
      <button class="filter" data-category="Beginner">Beginners</button>
      <button class="filter" data-category="Teen">Teens</button>
    </div>

    <div id="product-grid" class="product-grid"></div>

  </div>
</section>

<!-- REVIEWS -->
<section id="reviews" class="section">
  <div class="container">
    <h2>Reviews</h2>
    <button id="open-review" class="btn primary">Write review</button>
    <div id="review-list"></div>
  </div>
</section>

<!-- ABOUT -->
<section id="about" class="section">
  <div class="container">
    <h2>About FOOT</h2>
    <p>
      FOOT stands for <strong>Fishing Ocean Outdoor Tackle</strong> — built by anglers, for anglers.
    </p>
  </div>
</section>

</main>

<!-- CART MODAL -->
<div class="modal hidden" id="cart-modal">
  <div class="modal-box">
    <button id="close-cart">Close</button>
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal hidden" id="product-modal">
  <div class="modal-box">
    <button id="close-product">Close</button>
    <div id="product-content"></div>
  </div>
</div>

<!-- REVIEW MODAL -->
<div class="modal hidden" id="review-modal">
  <div class="modal-box">
    <button data-close-modal>Close</button>

    <form id="review-form">
      <select id="review-product"></select>
      <input id="review-name" placeholder="Name" required>

      <select id="review-rating">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
      </select>

      <input id="review-title" placeholder="Title" required>
      <textarea id="review-body" placeholder="Review"></textarea>

      <button type="submit">Post</button>
    </form>
  </div>
</div>

<script src="products.js"></script>
<script src="app.js"></script>

</body>
</html>
