<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOOT Fishing & Co.</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="shipping-bar">
🚚 Free shipping over $150
</div>

<header class="site-header">
<div class="container nav-wrap">

<div class="brand">FOOT™ Fishing & Co.</div>

<nav>
<a href="#shop">Shop</a>
<a href="#reviews">Reviews</a>
<a href="#contact">Order</a>
</nav>

<button id="cart-button">
🛒 <span id="cart-count">0</span>
</button>

</div>
</header>

<section class="hero">
<h1>Built by anglers. For anglers.</h1>
<p>Find the perfect rod — not just any rod.</p>
</section>

<!-- SHOP -->
<section id="shop" class="container">
<h2>Shop</h2>

<div id="product-grid"></div>
</section>

<!-- CONTACT / ORDER FORM -->
<section id="contact" class="container">
<h2>Order / Enquiry</h2>

<form id="order-form">

<input type="text" id="cust-name" placeholder="Your name" required>

<input type="email" id="cust-email" placeholder="Your email" required>

<input type="text" id="location" placeholder="Where are you located?" required>

<select id="product-select">
<option value="">Select a rod</option>
</select>

<textarea id="message" placeholder="Extra details (optional)"></textarea>

<button type="submit" class="btn primary">Send Enquiry</button>

</form>
</section>

<!-- REVIEWS -->
<section id="reviews" class="container">
<h2>Reviews</h2>

<button id="open-review">Write Review</button>

<div id="review-list"></div>
</section>

<footer>
© 2026 FOOT Fishing and Co.
</footer>

<script src="products.js"></script>
<script src="app.js"></script>

</body>
</html>
